meta:
  version: "2026.1"
  date: "2026-11-06"
  sources:
    - "RoboMaster 2026 RMUA rules v1 (third-party mirror referenced by issue #1)"
    - "Official simulator README, branch RMUA2026-01"
    - "voicepeak/RMUA2026-re docs/19 and docs/20"
  note: "Rules are encoded as data. Runtime calibration can override any field."

world:
  frame: "NED"
  origin: "marker_1"
  length_unit: "m"
  ue_units_per_meter: 100.0

control:
  max_hz: 100
  action_modes: ["pwm", "vel_body"]
  first_signal_locks_interface: true
  vel_fields: ["vx", "vy", "vz", "yaw_rate", "acceleration", "emergency_stop"]
  acceleration_limit_mps2: 8.0
  pwm_motor_order: ["right_front", "left_rear", "left_front", "right_rear"]
  pwm_range: [0.0, 1.0]
  pwm_range_confidence: "approx"

sensors:
  imu_hz: 100
  gps_hz: 10
  gps_position_noise_m: 0.1
  gps_attitude_noise_rad: 0.2
  lidar_hz: 10
  lidar_points_per_frame: 20000
  lidar_range_m: 30.0
  camera_hz: 20
  camera_width: 960
  camera_height: 720
  camera_fov_deg: 60
  cameras: ["front_left", "front_right", "back_left", "back_right"]
  wind_sensor_hz: 50

course:
  start_timeout_s: 30.0
  trigger_zone_m: [10.0, 5.0, 7.0]
  force_field_limit_s: 2.0
  force_field_thrust_scale: 0.35
  ranking: ["detection_gates", "total_time"]
  detection_gates_total: 12
  factories_per_map: 12
  factory_devices: 20
  factory_red_lamps: 3
  factory_meter_range: [0, 50]
  wind_starts_after_marker: 8
  wind_indoors: false

deployment:
  docker_max_gb: 15
  submissions_per_day: 10
  seed_changes_with_submission_count: true
  no_gui: true
  must_not_exit: true

segments:
  - id: 1
    name: "1-3"
    start_marker: 1
    end_marker: 3
    time_limit_s: 180.0
    wind: false
    factory_before: 0
    factory_after: 0
    gates: ["1_1_Gate", "2_1_Gate"]
    route_names: ["1_1", "2_1"]
    confidence: "approx"
    notes: "Start/end marker mapping is official; gate name mapping needs runtime calibration."
  - id: 2
    name: "3-5"
    start_marker: 3
    end_marker: 5
    time_limit_s: 180.0
    wind: false
    factory_before: 0
    factory_after: 0
    gates: ["3_1_Gate", "4_1_Gate"]
    route_names: ["3_1", "4_1"]
    confidence: "approx"
  - id: 3
    name: "5-8"
    start_marker: 5
    end_marker: 8
    time_limit_s: 180.0
    wind: false
    factory_before: 0
    factory_after: 0
    gates: ["5_1_Gate", "6_1_Gate"]
    route_names: ["5_1", "6_1"]
    confidence: "approx"
  - id: 4
    name: "8-12"
    start_marker: 8
    end_marker: 12
    time_limit_s: 200.0
    wind: true
    factory_before: 1
    factory_after: 0
    gates: ["1_2_Gate", "6_2_Gate"]
    route_names: ["1_2", "6_2"]
    confidence: "approx"
    route_hints: ["2_2"]
    notes: "docs/17/local_models show binary stage 4 uses route 2_2; gate mapping still needs runtime calibration."
  - id: 5
    name: "12-10"
    start_marker: 12
    end_marker: 10
    time_limit_s: 220.0
    wind: true
    factory_before: 1
    factory_after: 1
    gates: ["5_2_Gate", "4_2_Gate"]
    route_names: ["5_2", "4_2"]
    confidence: "approx"
    route_hints: ["4_2"]
  - id: 6
    name: "10-7"
    start_marker: 10
    end_marker: 7
    time_limit_s: 200.0
    wind: true
    factory_before: 1
    factory_after: 1
    gates: ["3_2_Gate", "2_2_Gate"]
    route_names: ["3_2", "2_2"]
    confidence: "approx"
    route_hints: ["1_2"]

drone:
  mass_kg: 0.9
  arm_length_m: 0.18
  ixx: 0.0046890742
  iyy: 0.0069312
  izz: 0.010421166
  motor_lift_coeff: 0.000367717
  motor_torque_coeff: 4.888486266072161e-06
  max_rpm: 11079.03
  max_rpm_confidence: "official-readme"
  note: "Official coefficients are kept for reference; sim-fast uses max_thrust scaling pending system identification."
