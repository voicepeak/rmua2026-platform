name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate data
        run: python scripts/validate_data.py
      - name: Test
        run: python -m pytest -q
      - name: Benchmark
        run: python scripts/benchmark.py --envs 64 --steps 100
